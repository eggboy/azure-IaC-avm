[project]
name = "multi-auth-mcp"
version = "1.0.0"
description = "Streamable-HTTP MCP server supporting NoAuth / API-key / Entra JWT side-by-side."
requires-python = ">=3.11"
# Direct (top-level) dependencies. uv resolves the full transitive closure into
# uv.lock, which is the reproducible source of truth for builds.
dependencies = [
    "mcp[cli]>=1.26.0",
    "starlette>=1.3.1",
    "uvicorn>=0.41.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# Environment-only project: uv manages the venv but does not build/install the
# local `src/` tree (it is run in place via `uvicorn src.server_multi_auth:app`).
package = false

# Pin security-patched floors for transitive dependencies flagged by Dependabot
# (pulled in via mcp / httpx / starlette). Keeps the resolved lock above the
# vulnerable ranges even if a future re-resolve would otherwise pick older.
constraint-dependencies = [
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "idna>=3.15",
    "pygments>=2.20.0",
]
